<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Persistent Craving Log</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ef4444; /* red-500 */
            --secondary-color: #fca5a5; /* red-300 */
            --background-color: #fef2f2; /* red-50 */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 1rem;
        }
        .container-card {
            max-width: 600px;
            width: 100%;
            background-color: white;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background-color: var(--primary-color);
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-primary:hover {
            background-color: #dc2626; /* red-600 */
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-google {
            background-color: #4285f4; /* Google Blue */
        }
        .btn-google:hover {
            background-color: #3b78e7;
        }
        .log-item {
            border-left: 4px solid var(--secondary-color);
            transition: background-color 0.2s;
        }
        .log-item:hover {
            background-color: #fef2f2; /* red-50 */
        }
    </style>
</head>
<body>

<div class="container-card">
    <h1 class="text-4xl font-extrabold text-gray-800 mb-2 text-center">The Craving Log</h1>
    <p class="text-center text-gray-500 mb-6">Track your urges. Stay mindful. Data is saved to Firestore.</p>

    <!-- Authentication Controls and Status -->
    <div id="auth-controls" class="mb-6 p-4 bg-gray-100 rounded-xl flex flex-col sm:flex-row justify-between items-center space-y-3 sm:space-y-0">
        <div id="auth-status" class="text-sm text-gray-700 w-full sm:w-auto">
            <p class="font-semibold">Status: <span id="user-status" class="text-red-600">Signed Out</span></p>
            <p>User ID: <code id="user-id" class="break-all text-xs text-gray-500">N/A</code></p>
        </div>
        
        <div class="flex space-x-2 w-full sm:w-auto justify-end">
            <button id="sign-in-btn" 
                    class="btn-google text-white font-bold py-2 px-4 rounded-lg shadow-md flex items-center justify-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18px" height="18px" class="fill-current text-white">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,7.74-11.303,7.74c-6.683,0-12.13-5.447-12.13-12.13s5.447-12.13,12.13-12.13c3.178,0,6.004,1.173,8.21,2.919l5.093-5.093C34.33,6.7,29.988,5,24,5C12.955,5,5,12.784,5,24c0,11.216,7.955,19,19,19c15,0,18-12,18-12C42,30,41,22,41,22z"></path>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,13,24,13c3.178,0,6.004,1.173,8.21,2.919l5.093-5.093C34.33,6.7,29.988,5,24,5C12.955,5,5,12.784,5,24c0,2.152,0.612,4.183,1.619,5.882h6.536C12.434,26.71,12,24.962,12,24C12,20.038,13.911,16.591,17.067,14.691z"></path>
                    <path fill="#4CAF50" d="M24,43c5.09,0,9.52-1.996,12.87-5.28l-6.571-4.819C29.345,34.892,25.039,37,24,37c-5.178,0-9.608-2.67-11.821-6.919L6.11,32.093C9.67,37.3,16.012,43,24,43z"></path>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.126,1.429-0.781,2.789-1.649,4.657-1.649,4.657-6.08,7.74-11.303,7.74c-6.683,0-12.13-5.447-12.13-12.13s5.447-12.13,12.13-12.13c3.178,0,6.004,1.173,8.21,2.919l5.093-5.093C34.33,6.7,29.988,5,24,5C12.955,5,5,12.784,5,24c0,11.216,7.955,19,19,19c15,0,18-12,18-12C42,30,41,22,41,22z" transform="translate(0,-1)"></path>
                </svg>
                <span id="sign-in-text">Sign In with Google</span>
            </button>
            <button id="sign-out-btn" disabled
                    class="bg-gray-400 text-white font-bold py-2 px-4 rounded-lg shadow-md hover:bg-gray-500 disabled:opacity-50">
                Sign Out
            </button>
        </div>
    </div>

    <!-- Log Input Form -->
    <form id="craving-form" class="space-y-4 p-5 bg-gray-50 rounded-xl shadow-inner">
        <div>
            <label for="craving-type" class="block text-sm font-medium text-gray-700">Craving Type (e.g., Sugar, Coffee, Social Media)</label>
            <input type="text" id="craving-type" placeholder="What are you craving?" required disabled
                   class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 disabled:bg-gray-200">
        </div>

        <div>
            <label for="intensity" class="block text-sm font-medium text-gray-700">Intensity (1-5)</label>
            <input type="number" id="intensity" min="1" max="5" value="3" required disabled
                   class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 disabled:bg-gray-200">
        </div>

        <div>
            <label for="notes" class="block text-sm font-medium text-gray-700">Notes (Optional)</label>
            <textarea id="notes" rows="2" placeholder="How did this craving feel? What were you doing?" disabled
                      class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 disabled:bg-gray-200"></textarea>
        </div>

        <button type="submit" id="submit-btn" disabled
                class="btn-primary w-full text-white font-bold py-2 px-4 rounded-lg shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
            Please Sign In to Log Craving
        </button>
    </form>

    <!-- Craving Log List -->
    <div class="mt-8">
        <h2 class="text-2xl font-bold text-gray-700 mb-4 border-b pb-2">Recent Logs</h2>
        <ul id="log-list" class="space-y-3">
            <!-- Log entries will be populated here by JavaScript -->
        </ul>
        <p id="loading-message" class="text-center text-gray-500 mt-4">Sign in to view your log.</p>
    </div>
</div>

<script type="module">
    // --- Firebase SDK Imports ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // IMPORTANT: Global variables provided by the Canvas environment
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

    // Global Firebase/State variables
    let app, db, auth;
    let userId = null;
    let unsubscribeLogListener = null;

    // UI Elements
    const logList = document.getElementById('log-list');
    const loadingMessage = document.getElementById('loading-message');
    const form = document.getElementById('craving-form');
    const submitBtn = document.getElementById('submit-btn');
    const signInBtn = document.getElementById('sign-in-btn');
    const signOutBtn = document.getElementById('sign-out-btn');
    const userIdSpan = document.getElementById('user-id');
    const userStatusSpan = document.getElementById('user-status');
    const formInputs = form.querySelectorAll('input, textarea, button[type="submit"]');


    /**
     * Converts a Firestore Timestamp to a readable string format.
     * @param {object} timestamp - The Firestore Timestamp object.
     * @returns {string} Formatted date and time string.
     */
    function formatTimestamp(timestamp) {
        if (!timestamp) return 'No Time';
        let date;
        if (timestamp.toDate) {
            date = timestamp.toDate();
        } else if (timestamp._seconds) {
            date = new Date(timestamp._seconds * 1000);
        } else {
            return new Date(timestamp).toLocaleString();
        }
        return date.toLocaleString();
    }

    /**
     * Renders the log entries onto the UI.
     * @param {Array<object>} cravings - The array of craving log objects.
     */
    function renderCravings(cravings) {
        logList.innerHTML = ''; // Clear existing list
        if (cravings.length === 0) {
            logList.innerHTML = '<li class="text-gray-500 italic p-4 text-center">No cravings logged yet. Start tracking!</li>';
            return;
        }

        cravings.forEach(doc => {
            const data = doc;
            const item = document.createElement('li');
            item.className = 'log-item p-4 rounded-lg bg-white shadow flex justify-between items-start';

            // Build the content HTML
            const content = `
                <div class="flex-grow">
                    <p class="text-lg font-semibold text-gray-800">${data.type}</p>
                    <p class="text-sm text-gray-500 mt-1">Intensity: <span class="font-bold text-red-600">${data.intensity}/5</span></p>
                    ${data.notes ? `<p class="text-sm italic text-gray-600 mt-1">Notes: ${data.notes}</p>` : ''}
                </div>
                <div class="text-right text-xs text-gray-400 ml-4 pt-1">
                    ${formatTimestamp(data.timestamp)}
                </div>
            `;
            item.innerHTML = content;
            logList.appendChild(item);
        });
    }
    
    /**
     * Toggles the disabled state of the form inputs.
     * @param {boolean} disabled - Whether to disable the inputs.
     */
    function toggleForm(disabled) {
        formInputs.forEach(input => {
            // Do not disable the submit button, handle that separately
            if (input.id !== 'submit-btn') {
                input.disabled = disabled;
            }
        });
        submitBtn.disabled = disabled;
        submitBtn.textContent = disabled ? 'Please Sign In to Log Craving' : 'Log Craving';
    }


    /**
     * Sets up a real-time listener to fetch and display the craving log.
     */
    function loadCravingLog(currentUserId) {
        if (unsubscribeLogListener) {
            unsubscribeLogListener(); // Unsubscribe from previous listener if one exists
        }

        if (!currentUserId) {
            loadingMessage.textContent = 'Sign in to view your log.';
            logList.innerHTML = '';
            return;
        }

        loadingMessage.classList.remove('hidden');
        loadingMessage.textContent = 'Loading log data...';

        // Define the collection path for private user data
        // /artifacts/{appId}/users/{userId}/craving_logs
        const logCollectionPath = `artifacts/${appId}/users/${currentUserId}/craving_logs`;
        const logsRef = collection(db, logCollectionPath);

        // Create a query to select documents
        const q = query(logsRef);

        // Set up the real-time listener
        unsubscribeLogListener = onSnapshot(q, (snapshot) => {
            const cravings = [];
            snapshot.forEach((doc) => {
                cravings.push({ id: doc.id, ...doc.data() });
            });

            // Sort client-side by timestamp in descending order (newest first)
            cravings.sort((a, b) => {
                const timeA = a.timestamp ? (a.timestamp.toDate ? a.timestamp.toDate() : new Date(a.timestamp._seconds * 1000)) : new Date(0);
                const timeB = b.timestamp ? (b.timestamp.toDate ? b.timestamp.toDate() : new Date(b.timestamp._seconds * 1000)) : new Date(0);
                return timeB - timeA;
            });

            renderCravings(cravings);
            loadingMessage.classList.add('hidden');
        }, (error) => {
            console.error("Error fetching documents:", error);
            loadingMessage.textContent = `Error loading log: ${error.message}`;
        });

        console.log("Firestore listener set up on:", logCollectionPath);
    }

    /**
     * Handles the Google Sign-In process.
     */
    async function signInWithGoogle() {
        const provider = new GoogleAuthProvider();
        signInBtn.disabled = true;
        const originalText = signInBtn.textContent;
        signInBtn.textContent = 'Awaiting Popup...';

        try {
            // Use signInWithPopup for browser-based OAuth flow
            await signInWithPopup(auth, provider);
            // onAuthStateChanged will handle the rest
        } catch (error) {
            console.error("Google Sign-In Error:", error);
            // Handle common errors like pop-up blocked or user dismissed
            if (error.code === 'auth/popup-closed-by-user') {
                 userStatusSpan.textContent = 'Sign In Failed: Pop-up closed.';
            } else {
                userStatusSpan.textContent = `Sign In Failed: ${error.message.substring(0, 30)}...`;
            }

        } finally {
            signInBtn.disabled = false;
            signInBtn.textContent = originalText;
        }
    }

    /**
     * Handles the sign-out process.
     */
    async function handleSignOut() {
        signOutBtn.disabled = true;
        try {
            await signOut(auth);
            // onAuthStateChanged will handle the UI update
        } catch (error) {
            console.error("Sign Out Error:", error);
            signOutBtn.disabled = false;
        }
    }


    /**
     * Initializes Firebase and sets up the Auth State listener.
     */
    function initFirebase() {
        try {
            // 1. Initialize Firebase App and services
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            setLogLevel('debug'); // Enable debug logging for Firestore

            // 2. Set up Auth State Listener
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // User is signed in
                    userId = user.uid;
                    userStatusSpan.textContent = user.displayName || user.email || 'Authenticated';
                    userStatusSpan.classList.replace('text-red-600', 'text-green-600');
                    userIdSpan.textContent = userId;

                    signInBtn.classList.add('hidden');
                    signOutBtn.classList.remove('opacity-50', 'disabled:cursor-not-allowed');
                    signOutBtn.disabled = false;
                    
                    toggleForm(false); // Enable the form

                    console.log('User signed in:', userId);
                    loadCravingLog(userId); // Start loading private data

                } else {
                    // User is signed out
                    userId = null;
                    userStatusSpan.textContent = 'Signed Out';
                    userStatusSpan.classList.replace('text-green-600', 'text-red-600');
                    userIdSpan.textContent = 'N/A';

                    signInBtn.classList.remove('hidden');
                    signOutBtn.disabled = true;

                    toggleForm(true); // Disable the form

                    // Clear the log list and stop listening
                    loadCravingLog(null); 
                    loadingMessage.classList.remove('hidden');
                    loadingMessage.textContent = 'Sign in to view your log.';

                    console.log('User signed out.');
                }
            });

        } catch (error) {
            console.error("Firebase Initialization Failed:", error);
            loadingMessage.textContent = 'Error initializing application. Check console.';
        }
    }


    /**
     * Handles form submission to save a new craving log entry to Firestore.
     */
    async function addCraving(event) {
        event.preventDefault();

        if (!userId) {
            console.error('Cannot log craving: User is not authenticated.');
            submitBtn.textContent = 'Sign In Required';
            setTimeout(() => submitBtn.textContent = 'Please Sign In to Log Craving', 2000);
            return;
        }

        const type = document.getElementById('craving-type').value.trim();
        const intensity = parseInt(document.getElementById('intensity').value, 10);
        const notes = document.getElementById('notes').value.trim();

        if (!type || intensity < 1 || intensity > 5) {
            return;
        }

        // Disable button and show loading state
        submitBtn.disabled = true;
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Saving...';

        try {
            // Define the collection path for private user data
            const logCollectionPath = `artifacts/${appId}/users/${userId}/craving_logs`;
            const logsRef = collection(db, logCollectionPath);

            await addDoc(logsRef, {
                type: type,
                intensity: intensity,
                notes: notes,
                timestamp: serverTimestamp(), // Use serverTimestamp for reliable time
                userId: userId,
            });

            // Clear the form fields upon successful save
            form.reset();
            document.getElementById('intensity').value = 3;

            console.log("Craving logged successfully!");

        } catch (error) {
            console.error("Error adding document:", error);
            submitBtn.textContent = 'Save Failed!';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        }
    }

    // --- Event Listeners and Initial Load ---
    form.addEventListener('submit', addCraving);
    signInBtn.addEventListener('click', signInWithGoogle);
    signOutBtn.addEventListener('click', handleSignOut);

    // Start the whole application
    window.onload = initFirebase;

</script>

</body>
</html>
